name: Stores Scrapper
on:
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * *"
permissions:
    contents: write
jobs:
    test:
        timeout-minutes: 45
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium
            - name: Run Stores Scrapper wrapped in Playwright tests
              run: npm run test
            - name: Commit generated JSON files
              run: |
                  git config --global user.name 'Aleksander Sosna'
                  git config --global user.email '70142273+AleksanderSosna@users.noreply.github.com'
                  git commit -am "gh actions commit"
                  git push
