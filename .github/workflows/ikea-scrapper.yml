name: Ikea Scrapper
on:
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * *"
env:
    CI: "true"
    BASE_URL: "https://www.ikea.com"
    COUNTRY_CODES: '["pl", "cz"]'
permissions:
    contents: write
jobs:
    test:
        timeout-minutes: 22
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "lts"
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium
            - name: Run Ikea Scrapper wrapped in Playwright tests
              run: npm run test
            - name: Commit generated JSON files
              run: |
                  git config --global user.name 'Aleksander Sosna'
                  git config --global user.email '70142273+AleksanderSosna@users.noreply.github.com'
                  git commit -am "gh actions commit"
                  git push
